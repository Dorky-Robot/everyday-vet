<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 55" fill="currentColor">
  <!-- Left paw - angled outward (counterclockwise) -->
  <g transform="rotate(-20, 27, 30)">
    <!-- Main pad -->
    <ellipse cx="27" cy="35" rx="13" ry="11"/>
    <!-- Top toe pads (3 in arc) -->
    <ellipse cx="14" cy="18" rx="6" ry="7"/>
    <ellipse cx="27" cy="13" rx="6" ry="7"/>
    <ellipse cx="40" cy="18" rx="6" ry="7"/>
    <!-- Outer side toe -->
    <ellipse cx="48" cy="30" rx="5" ry="6"/>
  </g>

  <!-- Right paw - angled outward (clockwise) -->
  <g transform="translate(55, 0) rotate(20, 27, 30)">
    <!-- Main pad -->
    <ellipse cx="27" cy="35" rx="13" ry="11"/>
    <!-- Top toe pads (3 in arc) -->
    <ellipse cx="14" cy="18" rx="6" ry="7"/>
    <ellipse cx="27" cy="13" rx="6" ry="7"/>
    <ellipse cx="40" cy="18" rx="6" ry="7"/>
    <!-- Outer side toe -->
    <ellipse cx="6" cy="30" rx="5" ry="6"/>
  </g>
</svg>
